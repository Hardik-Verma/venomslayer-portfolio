<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socials // VenomSlayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030303; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    <!-- Static Background Mimicry -->
    <div class="fixed inset-0 z-0 bg-[#030303]"></div>
    <div class="fixed inset-0 z-0 opacity-[0.06]" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%270 0 200 200%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cfilter id=%27noiseFilter%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%270.85%27 numOctaves=%273%27 stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23noiseFilter)%27/%3E%3C/svg%3E')"></div>
    <div class="fixed inset-0 z-0 bg-[radial-gradient(circle_at_center,transparent_0%,rgba(0,0,0,0.85)_100%)]"></div>

    <nav class="fixed top-0 left-0 w-full flex justify-between items-center px-8 py-10 z-50">
        <a href="/" class="font-black text-sm tracking-[0.3em] uppercase">VENOMSLAYER</a>
        <a href="/" class="text-[10px] uppercase tracking-[0.2em] text-white/50 hover:text-white transition-colors">Return to Base</a>
    </nav>

    <main class="relative z-10 w-full max-w-sm pt-20">
        <h1 class="text-white text-xl font-bold tracking-[0.4em] uppercase mb-16 text-center">Socials</h1>
        <div class="grid gap-4">
            <a href="/github" class="rounded-full border border-white/10 p-4 text-center uppercase tracking-widest text-[10px] font-bold hover:bg-white hover:text-black transition-all duration-300">GitHub</a>
            <a href="/modrinth" class="rounded-full border border-white/10 p-4 text-center uppercase tracking-widest text-[10px] font-bold hover:bg-white hover:text-black transition-all duration-300">Modrinth</a>
            <a href="/twitter" class="rounded-full border border-white/10 p-4 text-center uppercase tracking-widest text-[10px] font-bold hover:bg-white hover:text-black transition-all duration-300">Twitter / X</a>
            <a href="/instagram" class="rounded-full border border-white/10 p-4 text-center uppercase tracking-widest text-[10px] font-bold hover:bg-white hover:text-black transition-all duration-300">Instagram</a>
            <a href="/discord" class="rounded-full border border-white/10 p-4 text-center uppercase tracking-widest text-[10px] font-bold hover:bg-white hover:text-black transition-all duration-300">Discord</a>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full p-8 text-center text-[10px] uppercase tracking-[0.3em] text-white/20 z-10">
        © 2026 VenomSlayer
    </footer>
</body>
</html>
